plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sarge.localflix'
    compileSdk 34

    defaultConfig {
        applicationId "com.sarge.localflix"   // unchanged, so the app updates in place
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Android TV Leanback - only used for Theme.AppCompat.Leanback (TV-friendly theme)
    implementation 'androidx.leanback:leanback:1.2.0-alpha04'

    // Media3 ExoPlayer - native video playback (the web page itself is shown in a WebView)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'

    // Removed in the hybrid version because nothing uses them any more:
    // Retrofit, Gson, OkHttp (the web page talks to the server), Glide (posters come from the web page),
    // ConstraintLayout, media3-exoplayer-hls.
}
