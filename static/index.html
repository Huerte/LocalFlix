<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="description" content="LocalFlix - stream your local movie library to any device on your network.">
<title>LocalFlix</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>if(window.LocalFlixTV||navigator.userAgent.indexOf('LocalFlixTV')>=0)document.documentElement.classList.add('lftv')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-unfull" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
    <symbol id="i-cc" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10.5 10.2a2 2 0 00-3 1.8 2 2 0 003 1.8M16.5 10.2a2 2 0 00-3 1.8 2 2 0 003 1.8"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10v4"/></symbol>
    <symbol id="i-pip" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="6" height="5" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5l9 7-9 7z" fill="currentColor" stroke="none"/><path d="M18 5v14"/></symbol>
    <symbol id="i-b10" viewBox="0 0 24 24"><path d="M12 5a7.5 7.5 0 11-7.2 5.4"/><path d="M12 5V1.5L8 5l4 3.5"/><text x="12" y="15.4" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">10</text></symbol>
    <symbol id="i-f10" viewBox="0 0 24 24"><path d="M12 5a7.5 7.5 0 107.2 5.4"/><path d="M12 5V1.5L16 5l-4 3.5"/><text x="12" y="15.4" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">10</text></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-10"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M4 12a8 8 0 018-8 8 8 0 016.32 3.09"/><path d="M20 4v4h-4M20 12a8 8 0 01-8 8 8 8 0 01-6.32-3.09"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="5" y="5" width="3" height="3" fill="currentColor" stroke="none"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/><rect x="16" y="5" width="3" height="3" fill="currentColor" stroke="none"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="5" y="16" width="3" height="3" fill="currentColor" stroke="none"/>
      <path d="M14 14h3M14 17v3M17 14v3h3M17 20h3"/>
    </symbol>
  </defs>
</svg>

<a class="skip" href="#main">Skip to content</a>
<header class="topbar" id="topbar">
  <a class="brand" href="#/" aria-label="LocalFlix home"><svg class="ic brand-ic"><use href="#i-film"/></svg><span>LocalFlix</span></a>
  <nav class="tabs" aria-label="Main">
    <a href="#/" data-tab="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></a>
    <a href="#/browse" data-tab="browse"><svg class="ic"><use href="#i-grid"/></svg><span>Browse</span></a>
  </nav>
  <div class="search" id="search">
    <svg class="ic s-ic"><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="Search titles, years or folders" autocomplete="off" spellcheck="false" aria-label="Search movies" enterkeyhint="search" role="combobox" aria-expanded="false" aria-controls="sugg">
    <button class="s-clear" id="qclear" type="button" aria-label="Clear search" hidden><svg class="ic"><use href="#i-close"/></svg></button>
    <div class="sugg" id="sugg" role="listbox" hidden></div>
  </div>
  <button class="icon-btn" id="btnQr" type="button" aria-label="Scan to connect" title="Show QR code — scan with phone to connect" onclick="window.open('/qr','_blank')"><svg class="ic"><use href="#i-qr"/></svg></button>
  <button class="icon-btn" id="btnSettings" type="button" aria-label="Settings"><svg class="ic"><use href="#i-sliders"/></svg></button>
</header>

<main id="main" tabindex="-1"></main>

<div id="player" class="player" hidden>
  <video id="v" playsinline preload="metadata"></video>
  <div id="cues" class="cues" aria-live="off"></div>
  <div class="p-shade top"></div><div class="p-shade bottom"></div>
  <div class="p-top">
    <button class="pbtn" id="pBack" type="button" aria-label="Back to library"><svg class="ic"><use href="#i-back"/></svg></button>
    <div class="p-title"><div id="pTitle"></div><div id="pSub"></div></div>
  </div>
  <div class="p-center">
    <div id="pSpin" class="spin" hidden></div>
    <button id="pBig" class="big-play" type="button" aria-label="Play" hidden><svg class="ic"><use href="#i-play"/></svg></button>
    <div id="pFlash" class="flash" hidden></div>
  </div>
  <div class="p-bottom" id="pBottom">
    <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="seek-track"><div class="seek-buf" id="sBuf"></div><div class="seek-fill" id="sFill"></div></div>
      <div class="seek-thumb" id="sThumb"></div><div class="seek-tip" id="sTip" hidden></div>
    </div>
    <div class="p-row">
      <!-- Left cluster: playback controls + time -->
      <div class="p-cluster">
        <button class="pbtn" id="bBack" type="button" aria-label="Back 10 seconds"><svg class="ic"><use href="#i-b10"/></svg></button>
        <button class="pbtn" id="bPlay" type="button" aria-label="Play"><svg class="ic"><use href="#i-play"/></svg></button>
        <button class="pbtn" id="bFwd" type="button" aria-label="Forward 10 seconds"><svg class="ic"><use href="#i-f10"/></svg></button>
      </div>
      <button class="pbtn" id="bMute" type="button" aria-label="Mute"><svg class="ic"><use href="#i-vol"/></svg></button>
      <input class="vol" id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <div class="time"><span id="tCur">0:00</span><span class="sep">/</span><span id="tDur">0:00</span></div>
      <div class="grow"></div>
      <!-- Right cluster: overlays + extras -->
      <button class="pbtn" id="bNext" type="button" aria-label="Next episode" hidden><svg class="ic"><use href="#i-next"/></svg></button>
      <button class="pbtn pill" id="bSubs" type="button" aria-haspopup="menu" aria-label="Subtitles"><svg class="ic"><use href="#i-cc"/></svg><span class="lbl">Subtitles</span></button>
      <button class="pbtn pill" id="bAudio" type="button" aria-haspopup="menu" aria-label="Audio" hidden><svg class="ic"><use href="#i-audio"/></svg><span class="lbl">Audio</span></button>
      <button class="pbtn" id="bSet" type="button" aria-haspopup="menu" aria-label="Playback settings"><svg class="ic"><use href="#i-sliders"/></svg></button>
      <button class="pbtn" id="bPip" type="button" aria-label="Picture in picture"><svg class="ic"><use href="#i-pip"/></svg></button>
      <button class="pbtn" id="bFull" type="button" aria-label="Full screen"><svg class="ic"><use href="#i-full"/></svg></button>
    </div>
  </div>
  <div class="pmenu" id="pMenu" role="menu" hidden></div>
  <div class="ptoast" id="pToast" hidden></div>
  <div class="endcard" id="endCard" hidden></div>
  <div class="perr" id="pErr" hidden></div>
  <input type="file" id="subFile" accept=".srt,.vtt,.ass,.ssa,.sub" hidden>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="/static/app.js"></script>
<script src="/static/player.js"></script>
<script>LF.start();</script>
</body>
</html>
